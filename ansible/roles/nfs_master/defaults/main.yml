---
# roles/nfs_master/defaults/main.yml
#
# Fallback values for the NFS master-image build. Override these in
# group_vars/all.yml (or host_vars) for your environment. The committed
# example group_vars (group_vars/all.example.yml) mirrors these as a
# documented template.

# ─── Identity ─────────────────────────────────────────────────────────────
# Target Debian architecture. Default amd64 preserves the original behavior.
# Set to arm64 (or another Debian arch) in group_vars to build for that arch.
# When it differs from the driver's arch, playbooks/00_setup_debootstrap.yml
# performs a cross-build via debootstrap --foreign + qemu-user-static; see
# docs/nfs-master.md "Cross-build (other architectures)".
target_arch: amd64
target_hostname: master          # placeholder; differentiate_host.yml overrides per clone
target_domain: example.com
timezone: America/Argentina/Buenos_Aires
locale: en_US.UTF-8
locales_to_generate:
  - "en_US.UTF-8 UTF-8"
keyboard_layout: us
keyboard_model: pc105
keyboard_variant: ""
console_charmap: UTF-8
console_fontface: Fixed
console_fontsize: "8x16"
console_codeset: Lat15

# ─── Human (interactive) user ─────────────────────────────────────────────
master_user: sebastian
master_user_shell: /bin/bash
master_user_ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI...REPLACE-ME replace-with-your-public-key"
master_user_passwordless_sudo: false

# ─── Automation user (passwordless sudo, key-only) ────────────────────────
automation_user: ansible
automation_user_shell: /bin/bash
automation_user_ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI...REPLACE-ME replace-with-your-automation-key"

# ─── Network / NFS root ───────────────────────────────────────────────────
nfs_server: nfs.example.com
nfs_install_root: /srv/nfs/debian-bookworm
nfs_mount_options: defaults,noatime
nameserver: 192.0.2.1
search_domain: example.com

# ─── APT ──────────────────────────────────────────────────────────────────
debian_mirror: http://deb.debian.org/debian
debian_release: bookworm
debian_security_release: bookworm-security
debian_security_mirror: http://deb.debian.org/debian-security
# Kernel package to install into the image. The default uses Debian's
# per-architecture meta-package (linux-image-amd64, -arm64, -armhf,
# -i386, -ppc64el, -riscv64, -s390x), which exists for most arches.
# EXCEPTION: armel has NO generic meta-package — Debian ships only
# flavor-specific metas (linux-image-marvell for kirkwood/SheevaPlug,
# etc.), because armel spans unrelated SoC families with no common
# kernel config. For an armel build, override kernel_package in
# group_vars to the board's flavor meta (e.g. linux-image-marvell for
# kirkwood). Keep the version in sync with whatever uImage/uInitrd you
# actually boot (bookworm's linux-image-marvell currently tracks
# 6.1.0-50-marvell, 6.1.176-1).
kernel_package: linux-image-{{ target_arch }}
master_base_packages:
  - "{{ kernel_package }}"    # linux-image-amd64 | linux-image-arm64 | linux-image-marvell | ...
  - nfs-common
  - initramfs-tools
  - curl
  - ca-certificates
  - rsync
  - locales
  - tzdata
  - console-setup
  - keyboard-configuration
  - resolvconf
  - systemd-timesyncd
  - openssh-server
  - cron
  - ed
  - file
  - bash-completion
  - dnsutils
  - gnupg
  - htop
  - iotop
  - less
  - lsof
  - man-db
  - manpages
  - mc
  - mtr-tiny
  - python3
  - reportbug
  - sudo
  - tcpdump
  - time
  - traceroute
  - usbutils
  - wget
  - whois
  - nullmailer
  - logrotate
  - dctrl-tools
# Install every package at Debian "important" or "standard" priority.
install_priority_packages: true
# Keep these out of the master image even if the priority pass would pull them.
master_excluded_packages:
  - systemd-resolved

# ─── Mail (nullmailer) ────────────────────────────────────────────────────
nullmailer_relayhost: ""
nullmailer_defaultdomain: "{{ target_domain }}"

# ─── SSH policy ───────────────────────────────────────────────────────────
# ubuntu_style_sudo.yml owns PermitRootLogin and the sudoers policy; these
# handle the remaining sshd_config lines.
sshd_password_authentication: "no"
sshd_pubkey_authentication: "yes"

# ─── Initramfs (NFS root) ─────────────────────────────────────────────────
initramfs_modules: netboot
initramfs_boot: nfs
initramfs_compress: zstd

# ─── Publish kernel/initrd ────────────────────────────────────────────────
kernel_deploy_method: s3
publish_refresh_initrd: true
s3_endpoint_url: "http://s3.example.com:9000"
s3_bucket: netboot
s3_prefix: "debian/{{ debian_release }}/{{ target_arch }}"   # keep arch in the path so arches don't clobber each other
s3_kernel_object: vmlinuz
s3_initrd_object: initrd
tftp_dest_host: ""
tftp_dest_path: "/srv/tftp/debian-{{ debian_release }}-{{ target_arch }}"   # arch-suffixed so arches don't clobber each other
