# Reusable superuser policy component.
#
# Three knobs make it reusable across contexts:
#   sudo_target_hosts   - which hosts to target (default: all)
#   sudo_become         - whether to escalate (default: true; set false for
#                         the chroot connection, which is already root)
#   sudo_users          - users to add to the sudo group (default: [])
---
- name: Configure Ubuntu-style sudo (root locked, users sudo with password)
  hosts: "{{ sudo_target_hosts | default('all') }}"
  become: "{{ sudo_become | default(true) }}"
  gather_facts: true

  vars:
    sudo_group: sudo
    sshd_permit_root_login: 'prohibit-password'

  tasks:
    - name: Ensure sudo is installed
      ansible.builtin.apt:
        name: sudo
        state: present

    - name: Ensure sudo group exists
      ansible.builtin.group:
        name: "{{ sudo_group }}"
        state: present

    - name: Deploy sudoers file — sudo group with password
      ansible.builtin.template:
        src: ../templates/sudoers.j2
        dest: /etc/sudoers
        owner: root
        group: root
        mode: '0440'
        validate: 'visudo -cf %s'
        backup: true

    - name: Lock root account — no password, no direct login
      ansible.builtin.user:
        name: root
        password: '!'   # locked, not '!!' (no password set at all)

    - name: Set PermitRootLogin in sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PermitRootLogin'
        line: 'PermitRootLogin {{ sshd_permit_root_login }}'
        validate: 'sshd -t -f %s'
      notify: Restart sshd

    - name: Add specified users to sudo group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: "{{ sudo_group }}"
        append: true
      loop: "{{ sudo_users | default([]) }}"

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: ssh
        state: restarted
      # In a chroot build, systemd is not running and ssh isn't started;
      # the config takes effect when ssh starts on first boot. Skip the
      # restart there. For live SSH hosts the restart runs as intended.
      when: ansible_connection != 'chroot'
