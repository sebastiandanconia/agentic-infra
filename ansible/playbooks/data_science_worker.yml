---
- name: Install packages (data science worker)
  hosts: all
  become: true
  gather_facts: true

  vars:
    agent_user: ansible
    agent_user_shell: /bin/bash

  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name:
          - git
          - ffmpeg
          - python3-dev
          - python3-venv
          - python3-pip
          - build-essential
          - pkg-config
          - rsync
          - libgl1
          - shorewall-lite
        state: present
        update_cache: true
