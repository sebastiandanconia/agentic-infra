; Example inventory for the NFS master-image bootstrap.
; Copy to hosts.ini and edit. hosts.ini is gitignored; ansible.cfg sets
; inventory = hosts.ini.
;
; Run the controller as root (mounts + chroot):
;   sudo -H ansible-playbook -i hosts.ini playbooks/nfs-root-provision/site_bootstrap.yml

; --- Driver host -----------------------------------------------------------
; Debootstrap, bind-mounts, kernel/initrd publish. Local connection.
[master_build_driver]
salamanca ansible_connection=local

; --- Chroot target ---------------------------------------------------------
; Debootstrapped tree. /mnt/target must exist with bind-mounts up
; (00_setup_debootstrap.yml or site_bootstrap.yml).
; ansible_host is the chroot root path, not a network address.
[master_chroot]
master ansible_host=/mnt/target ansible_connection=chroot

; --- NFS-booted hosts ------------------------------------------------------
; SSH as the automation user after first boot (unique host keys present).
[netboot_hosts]
; netboot-node ansible_host=10.0.0.5 ansible_user=ansible
